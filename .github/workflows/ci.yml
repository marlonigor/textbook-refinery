name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"
      - name: Verificar projeto
        shell: pwsh
        run: .\bin\check.ps1
